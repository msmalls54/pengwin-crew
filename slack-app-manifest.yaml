_metadata:
  major_version: 1
display_information:
  name: Brackenrow Concierge
features:
  bot_user:
    display_name: Brackenrow Concierge
    always_online: false
  slash_commands:
    - command: /crew
      description: Run a fictional office-ops demo or check its controls.
      usage_hint: pantry | welcome | hoodies | status | budgets
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
